[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiolens"
version = "0.1.0"
description = "CardioLens — ECG detection and interpretation system (MVP)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pydantic>=2",
    "pyyaml",
    "networkx",
    "wfdb",
    "pyedflib",
    "neurokit2",
    "matplotlib",
    "reportlab",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
]

[project.optional-dependencies]
llm = ["anthropic"]
validation = ["pandas"]
digitize = ["opencv-python-headless"]
telegram = ["telethon", "opencv-python-headless"]
# DICOM waveform ECG input (D94; MIT).
dicom = ["pydicom>=2.4"]
# ECG scanner (src/ecgscan, docs/scanner): image I/O, ScanResult schema check, header OCR (Apache-2.0).
scanner = ["opencv-python-headless", "jsonschema", "rapidocr-onnxruntime", "cryptography"]
bot = ["aiogram>=3", "httpx"]
dev = ["pytest", "ruff", "httpx", "opencv-python-headless", "jsonschema", "rapidocr-onnxruntime", "cryptography",
       "pydicom>=2.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecgscan = ["contract/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# Declare the source layout so first-party import detection is deterministic
# across environments (CI vs local editable install).
src = ["src", "tests"]

[tool.ruff.lint]
# Ignore idiomatic patterns: dict() kwargs for readability, deliberate broad
# excepts around best-effort DSP, FastAPI Form()/File() default-arg idiom,
# guard-clause boolean returns, and int() casts kept for clarity.
ignore = ["C408", "BLE001", "B008", "SIM103", "RUF046"]

[tool.ruff.lint.isort]
# Pin cardiolens as first-party so isort grouping never depends on whether the
# package happens to be pip-installed in the runner (fixes CI I001 drift).
known-first-party = ["cardiolens"]
