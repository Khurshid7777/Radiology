# CardioLens on the server (D153): the app behind Caddy, which gets and renews the HTTPS
# certificate for $DOMAIN by itself. Secrets come from deploy/.env on the server, written
# by the deploy workflow from the repository's GitHub secrets; nothing secret is in git.
#
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  cardiolens:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      CARDIOLENS_LLM_PROVIDER: ${CARDIOLENS_LLM_PROVIDER:-auto}   # Claude key -> stub
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ECGSCAN_API_KEYS: ${ECGSCAN_API_KEYS:?set ECGSCAN_API_KEYS in deploy/.env}
      ECGSCAN_STORAGE_KEY: ${ECGSCAN_STORAGE_KEY:-}
      ECGSCAN_SERVICE_DIR: /data/scanner_service
      CARDIOLENS_FEEDBACK_PATH: /data/feedback/feedback.jsonl
    volumes:
      - appdata:/data
    expose:
      - "8000"

  # The Telegram bot (D161): the same image, started only with the "bot" profile, i.e. when
  # deploy/.env holds a bot token; it talks to the app over the compose network.
  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    profiles: ["bot"]
    command: ["python", "-m", "ecgscan_bot"]
    restart: unless-stopped
    depends_on:
      - cardiolens
    environment:
      ECGSCAN_BOT_TOKEN: ${ECGSCAN_BOT_TOKEN:?set ECGSCAN_BOT_TOKEN in deploy/.env}
      ECGSCAN_BOT_API_KEY: ${ECGSCAN_BOT_API_KEY:?set ECGSCAN_BOT_API_KEY in deploy/.env}
      ECGSCAN_BOT_ALLOWED: ${ECGSCAN_BOT_ALLOWED:?set ECGSCAN_BOT_ALLOWED in deploy/.env}
      ECGSCAN_BOT_API_URL: http://cardiolens:8000
      ECGSCAN_BOT_MODE: analyze

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    depends_on:
      - cardiolens
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  appdata:
  caddy_data:
  caddy_config:
