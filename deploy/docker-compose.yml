# CardioLens on the server (D153): the app behind Caddy, which gets and renews the HTTPS
# certificate for $DOMAIN by itself. Secrets come from deploy/.env on the server, written
# by the deploy workflow from the repository's GitHub secrets; nothing secret is in git.
#
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# D310: every container keeps at most 3 x 10 MB of logs (an unbounded log once filled a disk).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  cardiolens:
    logging: *logging
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      CARDIOLENS_LLM_PROVIDER: ${CARDIOLENS_LLM_PROVIDER:-auto}   # Claude key -> stub
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ECGSCAN_API_KEYS: ${ECGSCAN_API_KEYS:?set ECGSCAN_API_KEYS in deploy/.env}
      ECGSCAN_STORAGE_KEY: ${ECGSCAN_STORAGE_KEY:-}
      CARDIOLENS_SHARE_SECRET: ${CARDIOLENS_SHARE_SECRET:-}    # D197, made by server_env.sh
      CARDIOLENS_ANALYSES_DIR: /data/analyses                     # D199, encrypted, 30 days
      ECGSCAN_SERVICE_DIR: /data/scanner_service
      CARDIOLENS_FEEDBACK_PATH: /data/feedback/feedback.jsonl
      CARDIOLENS_QUALITY_PATH: /data/feedback/quality.jsonl
    volumes:
      - appdata:/data
    expose:
      - "8000"

  # The Telegram bot (D161): the same image, started only with the "bot" profile, i.e. when
  # deploy/.env holds a bot token; it talks to the app over the compose network.
  bot:
    logging: *logging
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    profiles: ["bot"]
    command: ["python", "-m", "ecgscan_bot"]
    restart: unless-stopped
    depends_on:
      - cardiolens
    environment:
      ECGSCAN_BOT_TOKEN: ${ECGSCAN_BOT_TOKEN:?set ECGSCAN_BOT_TOKEN in deploy/.env}
      ECGSCAN_BOT_API_KEY: ${ECGSCAN_BOT_API_KEY:?set ECGSCAN_BOT_API_KEY in deploy/.env}
      ECGSCAN_BOT_ALLOWED: ${ECGSCAN_BOT_ALLOWED:?set ECGSCAN_BOT_ALLOWED in deploy/.env}
      ECGSCAN_BOT_API_URL: http://cardiolens:8000
      ECGSCAN_BOT_MODE: analyze
      # D208: invite codes and who joined with them (ids only), on the app's volume; links for colleagues.
      ECGSCAN_BOT_STORE: /data/bot/access.json
      ECGSCAN_BOT_PUBLIC_URL: https://cardio.vision-ai.uz
    volumes:
      - appdata:/data

  # The agents (D279): started only with the "agents" profile, i.e. when deploy/.env holds the agents bot token.
  # Isolated on purpose: no appdata volume (photos, analyses), no deploy/.env, no Docker socket. The host's daily
  # read-only security check (deploy/security_check.sh) is mounted read-only.
  agents:
    logging: *logging
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agents
    profiles: ["agents"]
    restart: unless-stopped
    depends_on:
      - cardiolens
    environment:
      AGENTS_TG_TOKEN: ${AGENTS_TG_TOKEN:-}      # required by the bot; ":-" so compose never fails the site without it
      AGENTS_OWNER_ID: ${AGENTS_OWNER_ID:-}
      AGENTS_TG_COORD: ${AGENTS_TG_COORD:-}
      AGENTS_TG_DEV: ${AGENTS_TG_DEV:-}
      AGENTS_TG_SCAN: ${AGENTS_TG_SCAN:-}
      AGENTS_TG_REVIEW: ${AGENTS_TG_REVIEW:-}
      AGENTS_TG_SEC: ${AGENTS_TG_SEC:-}
      AGENTS_TG_TRIAGE: ${AGENTS_TG_TRIAGE:-}
      AGENTS_TG_NEWS: ${AGENTS_TG_NEWS:-}
      AGENTS_TG_AUDIT: ${AGENTS_TG_AUDIT:-}       # D301: the controller
      AGENTS_GH_TOKEN: ${AGENTS_GH_TOKEN:-}
      AGENTS_SUMMARY_KEY: ${AGENTS_SUMMARY_KEY:-}
      AGENTS_SITE_URL: http://cardiolens:8000
      AGENTS_STATE: /state/agents.json
      AGENTS_WORK_BASE: /work
      AGENTS_MAX_PARALLEL: ${AGENTS_MAX_PARALLEL:-3}       # D308: 3 at once
      AGENTS_SECURITY_REPORT: /security/report.txt
    volumes:
      - agents_state:/state
      - agents_home:/home/agent
      - agents_work:/work
      - /var/lib/cardiovision-security:/security:ro
    # D300: several agents may run at once; the limits keep the site's share of the server (set in deploy/.env).
    mem_limit: ${AGENTS_MEM:-4g}
    cpus: ${AGENTS_CPUS:-2}

  caddy:
    logging: *logging
    image: caddy:2.8.4
    restart: unless-stopped
    depends_on:
      - cardiolens
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  appdata:
  agents_state:
  agents_home:
  agents_work:
  caddy_data:
  caddy_config:
