<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECG</title>
<!--
  The Mini App capture page (SD-137). The chosen photo goes to this site as the file the phone made
  (POST upload), so Telegram never compresses it; the bot then takes it and answers in the chat.
  The page talks to its own two addresses only (upload, send): no outside script, no storage, and
  Telegram's signed user data is never read. The texts and the ticket are put in by the server.
  A sheet that stands on end (SD-138): the doctor picks the upright one of two small turned copies drawn
  here from the chosen file; the turn itself is made by the server.
  Several photos of one record (SD-147): a long strip shot in parts, in order; the doctor sends them all at once.
  The live camera (SD-156): where Telegram lets a page use the camera, the frames are sent about once a second to this
  site's check (in memory, never kept) and the frame turns green when the shot will pass; the shot itself is the
  camera's full-size photo and goes the same way as a chosen file. Without the camera in the page, the buttons above.
-->
<style>
  :root { color-scheme: light dark; }
  body { font: 17px/1.4 system-ui, sans-serif; margin: 0; padding: 14px; max-width: 640px; }
  h1 { font-size: 20px; margin: 4px 0 8px; }
  p { margin: 6px 0; }
  .note { font-size: 14px; opacity: .8; }
  button, label.btn { display: block; width: 100%; box-sizing: border-box; margin: 10px 0; padding: 15px;
    font: inherit; border-radius: 12px; border: 1px solid #5b7c99; background: #2f6ea3; color: #fff; text-align: center; }
  .alt { background: transparent !important; color: inherit !important; }
  input[type=file] { display: none; }
  #status { margin: 14px 0 6px; font-weight: 600; min-height: 1.4em; }
  #bar { height: 6px; border-radius: 3px; background: #2f6ea3; width: 0; transition: width .2s; }
  ul { margin: 6px 0; padding-left: 20px; }
  #turn_title { font-weight: 600; }
  #turn_row button { padding: 6px; }      /* one under the other: large enough to read the lead labels */
  canvas { display: block; max-width: 100%; height: auto; margin: 0 auto; border-radius: 6px; }
  #parts { margin: 8px 0; padding-left: 22px; }
  #parts li { margin: 4px 0; }
  #parts .warn { color: #b26a00; }
  [hidden] { display: none !important; }
  #stage { position: relative; border: 6px solid #b33; border-radius: 12px; overflow: hidden; background: #000; }
  #stage.ok { border-color: #2a9d4b; }
  #stage video { display: block; width: 100%; height: auto; }
  #overlay { position: absolute; left: 0; top: 0; width: 100%; height: 100%; max-width: none; margin: 0; border-radius: 0; pointer-events: none; }
  #live_msg { font-weight: 600; min-height: 2.6em; }
  #b_shoot.ok { background: #2a9d4b; border-color: #2a9d4b; }
  label.chk { display: block; margin: 8px 0; }
</style>
</head>
<body>
<h1 id="title"></h1>
<p id="lead"></p>
<p id="tips" class="note"></p>
<p id="parts_hint" class="note"></p>

<ol id="parts"></ol>

<button id="b_live" hidden></button>
<div id="livebox" hidden>
  <p id="live_lead" class="note"></p>
  <div id="stage"><video id="video" playsinline muted autoplay></video><canvas id="overlay"></canvas></div>
  <p id="live_msg"></p>
  <label class="chk"><input type="checkbox" id="c_parts"> <span id="s_parts"></span></label>
  <button id="b_shoot"></button>
  <button id="b_live_close" class="alt"></button>
</div>

<div id="pickers">
  <label class="btn" for="f_cam" id="l_cam"></label>
  <input id="f_cam" type="file" accept="image/*" capture="environment">
  <label class="btn alt" for="f_gal" id="l_gal"></label>
  <input id="f_gal" type="file" accept="image/*" multiple>
</div>

<div id="bar"></div>
<p id="status"></p>
<div id="turnbox" hidden>
  <p id="turn_title"></p>
  <p id="turn_lead" class="note"></p>
  <div id="turn_row">
    <button id="b_ccw" class="alt"><canvas id="c_ccw"></canvas><span id="s_ccw"></span></button>
    <button id="b_cw" class="alt"><canvas id="c_cw"></canvas><span id="s_cw"></span></button>
  </div>
  <button id="b_keep" class="alt"></button>
</div>
<button id="b_send" hidden></button>
<button id="b_drop" class="alt" hidden></button>
<button id="b_retry" class="alt" hidden></button>

<script>
'use strict';
const PAGE = /*__PAGE__*/{};          // {texts, max_mb, max_files, lang, telegram_web, live}: put in by the server
const T = PAGE.texts || {};
const $ = id => document.getElementById(id);
const ticket = new URLSearchParams(location.search).get('t');
const TG_WEB = PAGE.telegram_web;
const MAX = PAGE.max_files || 10;
const parts = [];                      // what the server holds, in order: {width, height, mb, hints}
let busy = false, closed = false, retryFiles = null;
const LIVE = PAGE.live || {};
let live = null;                       // the open camera: {stream, capture, scale, timer, sending, good, thumb}

function text(key, vars) {
  return (T[key] || key).replace(/\{(\w+)\}/g, (m, k) => (vars && k in vars ? String(vars[k]) : m));
}
function status(s) { $('status').textContent = s; }
function progress(share) { $('bar').style.width = Math.round(100 * share) + '%'; }
function show(id, on) { $(id).hidden = !on; }
function tgEvent(name) {
  try {
    if (window.TelegramWebviewProxy) window.TelegramWebviewProxy.postEvent(name, '{}');
    // Telegram Web shows the page in a frame and listens to messages from it; to that site only.
    else if (window.parent !== window) window.parent.postMessage(JSON.stringify({ eventType: name, eventData: {} }), TG_WEB);
  } catch (e) { /* not Telegram */ }
}
function post(path, body, onProgress, query) {
  return new Promise(resolve => {
    const x = new XMLHttpRequest();
    x.open('POST', path + '?lang=' + encodeURIComponent(PAGE.lang || 'ru') + (query || ''));
    x.setRequestHeader('X-Miniapp-Ticket', ticket || '');
    if (body) x.setRequestHeader('Content-Type', 'application/octet-stream');
    if (onProgress) x.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    x.onload = () => { let d = null; try { d = JSON.parse(x.responseText); } catch (e) { /* not JSON */ } resolve({ status: x.status, body: d }); };
    x.onerror = x.ontimeout = x.onabort = () => resolve({ status: 0, body: null });
    x.send(body || null);
  });
}
function failure(code, body) {
  progress(0);
  if (code === 401) { status(text('miniapp.expired')); closed = true; render(); return; }
  if (code === 413) {
    const full = parts.length >= MAX || (body && /record/.test(String(body.detail || '')));
    if (!full && body && /picture/.test(String(body.detail || ''))) { status(text('miniapp.bad_size')); return; }
    status(full ? text('miniapp.record_full', { max: MAX, total: PAGE.max_total_mb }) : text('miniapp.too_big', { mb: PAGE.max_mb })); return;
  }
  if (code === 415) { status(text('miniapp.bad_format')); return; }
  if (code === 429) { status(text('miniapp.busy')); show('b_retry', !!retryFiles); return; }
  status(text('miniapp.failed')); show('b_retry', !!retryFiles);
}
function render() {
  const list = $('parts'); list.replaceChildren();
  parts.forEach((p, i) => {
    const li = document.createElement('li');
    // A record shot in parts: each part runs off the frame by design, so "frame" says nothing there (SD-147).
    const hints = p.hints.filter((h, k) => !(parts.length > 1 && p.codes[k] === 'frame'));
    li.textContent = text('miniapp.list_item', { i: i + 1, width: p.width || '?', height: p.height || '?', mb: p.mb }) +
      ' — ' + (hints.length ? hints.join(' ') : text('miniapp.list_ok'));
    if (hints.length) li.className = 'warn';
    list.appendChild(li);
  });
  const open = !closed && !busy;
  show('pickers', !closed && parts.length < MAX && !live);   // the live camera has its own button
  show('b_live', !closed && !live && parts.length < MAX && liveSupported());
  $('l_cam').textContent = parts.length ? text('miniapp.add_more') : text('miniapp.shoot');
  $('l_gal').textContent = parts.length ? text('miniapp.pick_more') : text('miniapp.pick');
  $('b_send').textContent = text('miniapp.send_n', { n: parts.length });
  show('b_send', open && parts.length > 0);
  show('b_drop', open && parts.length > 0);
}
// SD-138: the sheet seems to stand on end. Which way is up only the doctor can tell.
function askTurn(file) {
  return new Promise(async resolve => {
    let drawn = false;
    try {
      const bmp = await createImageBitmap(file);
      const k = Math.min(1, 720 / Math.max(bmp.width, bmp.height));
      for (const [id, deg] of [['c_cw', 90], ['c_ccw', 270]]) {
        const c = $(id); c.width = Math.round(bmp.height * k); c.height = Math.round(bmp.width * k);
        const g = c.getContext('2d');
        g.translate(c.width / 2, c.height / 2); g.rotate(deg * Math.PI / 180);
        g.drawImage(bmp, -bmp.width * k / 2, -bmp.height * k / 2, bmp.width * k, bmp.height * k);
      }
      bmp.close(); drawn = true;
    } catch (e) { /* a picture the browser cannot draw: the buttons say which way they turn */ }
    for (const side of ['cw', 'ccw']) { show('c_' + side, drawn); show('s_' + side, !drawn); }
    show('turnbox', true);
    const pick = deg => { show('turnbox', false); resolve(deg); };
    $('b_cw').onclick = () => pick(90); $('b_ccw').onclick = () => pick(270); $('b_keep').onclick = () => pick(0);
  });
}
async function uploadAll(files) {
  if (busy || !files.length) return;
  busy = true; retryFiles = null; show('b_retry', false); render();
  let skipped = false;
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    if (parts.length >= MAX) { status(text('miniapp.too_many', { max: MAX })); break; }
    if (file.size > PAGE.max_mb * 1024 * 1024) { failure(413); skipped = true; continue; }   // this one only; go on
    status(text('miniapp.uploading', { percent: 0 }));
    const r = await post('upload', file, share => {
      progress(share);
      status(share < 1 ? text('miniapp.uploading', { percent: Math.round(100 * share) }) : text('miniapp.checking'));
    });
    if (r.status !== 200 || !r.body) {
      const full = r.status === 413 && r.body && /record/.test(String(r.body.detail || ''));
      if (r.status === 413 && !full) { failure(413, r.body); skipped = true; continue; }   // too big: skip it, go on
      retryFiles = full ? null : files.slice(i); failure(r.status, r.body); break;
    }
    const d = r.body;
    parts.push({ width: d.width, height: d.height, mb: (file.size / 1048576).toFixed(1), hints: d.hints || [], codes: d.codes || [] });
    render();
    if (d.turn) {
      progress(0); status('');
      const deg = await askTurn(file);
      if (deg) {
        const t = await post('turn', null, null, '&part=' + d.part + '&rotate=' + deg);
        if (t.status !== 200) { retryFiles = files.slice(i + 1); failure(t.status, t.body); break; }   // kept as shot
      }
    }
    if (!skipped) { progress(0); status(''); }
  }
  busy = false; render();
  show('b_retry', !!(retryFiles && retryFiles.length));
}
// SD-156: the live camera. Only counts and the frame's verdict come back; the frame is not kept anywhere.
function liveSupported() { return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia); }
function blobOf(canvas, quality) { return new Promise(r => canvas.toBlob(r, 'image/jpeg', quality)); }
async function openLive() {
  if (live || busy || closed) return;
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 3840 }, height: { ideal: 2160 } } });
  } catch (e) { status(text('miniapp.live_denied')); show('b_live', false); return; }
  const v = $('video');
  v.srcObject = stream;
  try { await v.play(); } catch (e) { /* autoplay: shown on the first frame */ }
  if (!v.videoWidth) await new Promise(r => v.addEventListener('loadedmetadata', r, { once: true }));
  const track = stream.getVideoTracks()[0];
  let capture = null, long = Math.max(v.videoWidth, v.videoHeight);
  // The shot is the camera's full photo where the browser gives it; px/mm is said for that photo (long side to long side).
  if (window.ImageCapture && track) {
    try {
      capture = new ImageCapture(track);
      const pc = await capture.getPhotoCapabilities();
      if (pc && pc.imageWidth && pc.imageWidth.max) long = Math.max(long, pc.imageWidth.max);
    } catch (e) { capture = null; }
  }
  live = { stream, capture, scale: long / Math.max(v.videoWidth, v.videoHeight), timer: 0, sending: false, good: 0,
           thumb: null, frame: document.createElement('canvas') };
  $('live_msg').textContent = text('miniapp.live_wait');
  show('livebox', true); render();
  tick();
}
function closeLive() {
  if (!live) return;
  clearTimeout(live.timer);
  for (const t of live.stream.getTracks()) t.stop();
  $('video').srcObject = null;
  live = null;
  show('livebox', false); $('stage').className = ''; $('b_shoot').className = '';
  render();
}
function tick() {
  if (!live) return;
  live.timer = setTimeout(tick, LIVE.interval_ms || 1000);
  if (!live.sending && !busy) sendFrame();
}
function moving(c) {
  // The phone moves when two small grey copies of the frame differ much (a blurred shot would be refused).
  const t = document.createElement('canvas'); t.width = 64; t.height = Math.max(1, Math.round(64 * c.height / c.width));
  const g = t.getContext('2d', { willReadFrequently: true }); g.drawImage(c, 0, 0, t.width, t.height);
  const d = g.getImageData(0, 0, t.width, t.height).data, grey = new Float32Array(d.length / 4);
  for (let i = 0; i < grey.length; i++) grey[i] = 0.299 * d[4 * i] + 0.587 * d[4 * i + 1] + 0.114 * d[4 * i + 2];
  const prev = live.thumb; live.thumb = grey;
  if (!prev || prev.length !== grey.length) return false;
  let sum = 0; for (let i = 0; i < grey.length; i++) sum += Math.abs(grey[i] - prev[i]);
  return sum / grey.length > (LIVE.still_diff || 6);
}
function outline(corners, ok) {
  const o = $('overlay'), v = $('video');
  o.width = v.videoWidth; o.height = v.videoHeight;
  const g = o.getContext('2d'); g.clearRect(0, 0, o.width, o.height);
  if (!corners || corners.length !== 4) return;
  g.lineWidth = Math.max(4, o.width / 200); g.strokeStyle = ok ? '#2a9d4b' : '#e0a000';
  g.beginPath();
  corners.forEach(([x, y], i) => (i ? g.lineTo : g.moveTo).call(g, x * o.width, y * o.height));
  g.closePath(); g.stroke();
}
async function sendFrame() {
  const v = $('video'), c = live.frame;
  if (!v.videoWidth) return;
  const k = Math.min(1, (LIVE.frame_width || 1600) / Math.max(v.videoWidth, v.videoHeight));
  c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  const still = !moving(c);
  live.sending = true;
  const blob = await blobOf(c, LIVE.jpeg_quality || 0.75);
  const finalWidth = Math.round(v.videoWidth * live.scale);
  const r = blob ? await post('live', blob, null, '&final_width=' + finalWidth + '&parts=' + ($('c_parts').checked ? 1 : 0)) : null;
  if (!live) return;
  live.sending = false;
  if (!r || r.status === 429 || r.status === 0) return;              // busy or no network: the next frame
  if (r.status === 401) { closeLive(); failure(401); return; }
  if (r.status !== 200 || !r.body) return;
  const d = r.body;
  live.good = d.ready && still ? live.good + 1 : 0;
  const ok = live.good >= (LIVE.ready_frames || 2);
  $('stage').className = ok ? 'ok' : ''; $('b_shoot').className = ok ? 'ok' : '';
  outline(d.corners, ok);
  $('live_msg').textContent = ok ? text('miniapp.live_ready', { ppm: d.px_per_mm ? d.px_per_mm.toFixed(1) : '?' })
    : !still ? text('miniapp.live_moving') : (d.hints && d.hints.length ? d.hints.join(' ') : text('miniapp.live_wait'));
}
async function shoot() {
  if (!live || busy) return;
  let blob = null;
  if (live.capture) { try { blob = await live.capture.takePhoto(); } catch (e) { blob = null; } }
  if (!blob) {                          // no full photo from the browser: the video frame at the camera's size
    const v = $('video'), c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight; c.getContext('2d').drawImage(v, 0, 0);
    blob = await blobOf(c, 0.95);
  }
  if (!blob) { status(text('miniapp.failed')); return; }
  const inParts = $('c_parts').checked;
  if (!inParts) closeLive();            // one sheet: the camera is done; a strip in parts keeps it open for the next part
  await uploadAll([new File([blob], 'ecg.jpg', { type: blob.type || 'image/jpeg' })]);
  if (live && parts.length >= MAX) closeLive();
}
async function dropLast() {
  if (busy || !parts.length) return;
  busy = true; render();
  const r = await post('drop', null, null, '&part=' + (parts.length - 1));
  busy = false;
  if (r.status === 200) parts.pop(); else failure(r.status, r.body);
  render();
}
async function send() {
  if (busy || !parts.length) return;
  busy = true; render();
  const r = await post('send', null, null);
  busy = false;
  if (r.status !== 200) { failure(r.status, r.body); render(); return; }
  progress(1); closed = true; render();
  status(text('miniapp.sent'));
  setTimeout(() => tgEvent('web_app_close'), 2500);
}
function start() {
  document.documentElement.lang = PAGE.lang || 'ru';
  document.title = text('miniapp.title');
  $('title').textContent = text('miniapp.title');
  $('lead').textContent = text('miniapp.lead');
  $('tips').textContent = text('miniapp.tips');
  $('parts_hint').textContent = text('miniapp.parts_hint', { max: MAX });
  $('b_drop').textContent = text('miniapp.drop_last');
  $('b_retry').textContent = text('miniapp.retry');
  $('turn_title').textContent = text('miniapp.turn_title');
  $('turn_lead').textContent = text('miniapp.turn_lead');
  $('b_keep').textContent = text('miniapp.turn_keep');
  $('s_ccw').textContent = text('miniapp.turn_left'); $('b_ccw').setAttribute('aria-label', text('miniapp.turn_left'));
  $('s_cw').textContent = text('miniapp.turn_right'); $('b_cw').setAttribute('aria-label', text('miniapp.turn_right'));
  $('b_live').textContent = text('miniapp.live_open'); $('b_live_close').textContent = text('miniapp.live_close');
  $('b_shoot').textContent = text('miniapp.live_shoot'); $('s_parts').textContent = text('miniapp.live_parts');
  $('live_lead').textContent = text('miniapp.live_lead');
  $('b_live').addEventListener('click', openLive); $('b_live_close').addEventListener('click', closeLive);
  $('b_shoot').addEventListener('click', shoot);
  document.addEventListener('visibilitychange', () => { if (document.hidden) closeLive(); });   // the camera is let go
  for (const id of ['f_cam', 'f_gal']) {
    $(id).addEventListener('change', ev => { const f = [...(ev.target.files || [])]; ev.target.value = ''; uploadAll(f); });
  }
  $('b_send').addEventListener('click', () => { closeLive(); send(); });
  $('b_drop').addEventListener('click', dropLast);
  $('b_retry').addEventListener('click', () => uploadAll(retryFiles || []));
  if (!ticket) { status(text('miniapp.no_ticket')); closed = true; }
  render();
  tgEvent('web_app_ready'); tgEvent('web_app_expand');
}
start();
</script>
</body>
</html>
