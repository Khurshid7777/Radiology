# ecgscan pipeline thresholds (TZ §0.3: everything tunable lives here).

quality:
  min_px_per_mm: 7.0             # TZ §5.3, SD-099: below this -> rejected LOW_RESOLUTION (was 8.0: a 200-dpi scan is 7.5-7.9)
  max_megapixels: 60             # D136: checked from the file header before decoding -> rejected IMAGE_TOO_LARGE
  flatfield_below: 180           # SD-062: paper (p90 grey) darker than this -> illumination divided out of the working copy, LOW_LIGHT
  flatfield_target: 235          # SD-062: the paper level it is scaled to
  low_light_needs_confirmation: true   # SD-062: until checked on real dark photos, a corrected one is never "ok" by itself
  min_side_px: 200               # D136: a smaller image -> rejected LOW_RESOLUTION before any check runs
  marginal_px_per_mm: 10.0       # below this -> warning LOW_RESOLUTION_MARGINAL
  min_grid_confidence: 0.3       # grid read below this -> rejected GRID_NOT_FOUND (bench: 113/114 correct reads are above, no wrong one is)
  capture_qc: true               # repeat the phone's frame checks on the photo (quality.sharpness / glare_fraction)
  min_trace_contrast: 0.15       # below -> rejected LOW_CONTRAST (SD-064; was 0.67: faded print read at r 0.97 down to ~0.2)
  faded_below: 0.67              # SD-064: 0.15-0.67 (synthetic faded thermal 0.645) -> read, FADED_PAPER, never ok by itself

# D170, SD-074: a messenger copy (~3-4 px/mm, the 1-mm lines lost to JPEG) is read from the 5-mm
# grid, brought up to the working scale, and returned needs_confirmation + LOW_RESOLUTION_COARSE.
coarse:
  enabled: true
  max_side_px: 2000              # only images this small (a phone original is 3000-4000 px: never coarse)
  min_page_mm: 160               # a fine grid implying a narrower image than this is a misread (a 1280-px copy read at 2x: 116-123 mm)
  min_px_per_mm: 2.5             # below: the 5-mm period (12.5 px) is not trusted -> LOW_RESOLUTION stands
  min_score: 0.3                 # 5-mm comb score (spectral medians), whole image; real messenger copies 0.3-0.5 (synthetic ~1-2)
  max_upscale: 4.0               # 2.5 px/mm x 4 = the 10 px/mm working scale

geometry:
  working_px_per_mm: 10.0        # the photo is resampled to this before rectification (speed; 5 ms/px at 25 mm/s... 2.5 at 50)
  max_upscale: 1.45              # 8..10 px/mm photos are brought up to 10: the M2 (legacy) trace reader
                                 # rounds px/mm to an integer (a 9.3 page would be timed 3 % wrong); M3 lifts this
  fit_px_per_mm: null            # fit the perspective homography at the working scale (6 px/mm was 2x faster but lost the traces: photo r 0.94 -> 0.30)
  shear_min_deg: 0.3             # grid rows and columns tilted apart by more than this: de-shear, not just de-rotate (SD-054)
  tile_aspect: 2.0               # a frame longer than this x its width: if the whole-frame grid is weak, read it in pieces (a strip, SD-059)
  grid_tiles: 3
  reread_tolerance: 0.15         # SD-068: a grid re-read after perspective further than this from the predicted scale is not the grid

calibration:
  speeds_mm_s: [25, 50]
  gains_mm_mv: [5, 10, 20]
  value_tolerance: 0.12          # a measured value within this fraction of a standard one is that value
  layout_speed_conf: 0.5         # candidate from the ink length / layout record length (never establishes alone)
  pulse:
    min_agreeing: 2              # pulses needed for full confidence (one -> lower confidence)
    gain_conf_single: 0.75
    gain_conf_multi: 0.95
    speed_conf: 0.35             # SD-011: pulse width is a weak speed hint
    retry_widen_px: 5            # no pulse found: retry on the mask widened this much across and
    retry_close_px: 7            # ... with vertical gaps up to this closed (a thin, slightly slanted real pulse, SD-059)
    top_search_mm: 1.5           # SD-086: on the dark-ink retry the edges' tops may differ this much (an edge broken under the top's corner)
    extend_max_gap_mm: 4.0       # D180: a found pulse is extended down while both edges go on, gaps up to this bridged
  ocr:
    enabled: true
    # S3 (SD-090): RapidOCR's detector with the Cyrillic PP-OCRv5 recogniser (Cyrillic incl. Uzbek,
    # Latin, digits). Missing or altered model -> OCR unavailable with the reason, never a silent fallback.
    rec_model: models/ocr/cyrillic_PP-OCRv5_rec_mobile.onnx
    rec_sha256: 90f761b4bfcce0c8c561c0cb5c887b0971d3ec01c32164bdf7374a35b0982711   # = models/ocr/model_card.json
    whole_header: true             # read the header to its end: the recorder's measurements, model, date (TZ 18.6)
    device_models:                 # recorder-model patterns looked for in the header (first match wins)
      - 'SCHILLER\s+[A-Z]{1,3}-?\d{1,4}\w*'
      - 'Mindray\s+\w+(?:\s+R\d+)?'
      - 'EDAN\s+[A-Z]{1,3}-?\d{3,4}\w*'
      - 'Nihon\s*Kohden\s+[\w-]+'
      - 'Fukuda\s+[\w-]+'
      - 'MAC\s?\d{3,4}'
      - 'Аксион\s+ЭК[\w/-]+'
      - 'Альтон-?\d+'
      - 'ЭК\d+Т[\w/-]*'
    header_frac: 0.25
    footer_frac: 0.12
    conf: 0.9
    row_clear_pitch: 0.6           # header / footer bands start this far (x row pitch) from the edge rows' baselines
    row_near_pitch: 0.2            # ... or as near as this when the page edge leaves less than min_band_mm (SD-085; Kit 12390: trace ink ends 0.16 pitch under the baseline, text at 0.33)
    tile_min_mm: 60                # OCR tiles at least this wide ...
    colour_retry_frac: 0.02        # speed/gain unread and >= this share of a band coloured: read it again on the brightest channel (SD-088)
    tile_overlap_mm: 30            # ... overlapping this much: a setting ("25mm/s" ~15 mm) whole in some tile (SD-087)
    min_band_mm: 12                # ECG-Image-Kit: "25mm/s" 6 mm under the rhythm trace, 3 mm from the edge
  # Rules (SD-011, TZ §5.4):
  #  speed is established only by OCR or the user; pulse width alone -> needs_confirmation;
  #  gain is established by the pulse (OCR agreeing or absent) or the user; OCR alone -> needs_confirmation;
  #  any disagreement between sources -> needs_confirmation with the candidates.

layout:
  pitch_tolerance: 0.1           # measured baseline pitch within this fraction of a registry pitch matches it
  stroke_min_height_mm: 2.0      # a trace row needs a complex this tall somewhere (a paper edge is <1 mm in every column); 3 lost lead III of a real strip (SD-059)
  stroke_bridge_mm: 1.0          # trace pieces the mask split are joined across gaps this long when judging a row (SD-059)

segmentation:
  drop_grid_lines:               # SD-099: a black grid (b/w scan) in the mask: its straight 5-mm lines removed
    enabled: true                # only when the grid's lines are in the mask (grid_in_mask); a red grid never is
    min_h_mm: 20                 # a horizontal run this long on the 5-mm lattice is a grid line
    min_v_mm: 8                  # a vertical one this tall (pulse boxes kept)
  kind: onnx                     # onnx (M6, SD-053: wins on the benchmark) | classic; no model -> error, never a silent fallback
  onnx_model: models/segmenter/trace_unet.onnx   # M6 (SD-052); sha256 below must match models/segmenter/model_card.json
  onnx:
    sha256: 607cb279e8445456b91ad3fcbcc60f063b94cb880617cdb21dc1785aef7c078f   # = models/segmenter/model_card.json
    threshold: 0.7               # stroke probability above this = ink (SD-061: 0.5 -> 0.7, a thinner mask centres flanks better)
    tile: 1024                   # tiles with overlap: bounded memory on a 3000-px page
    overlap: 32
    threads: null                # onnxruntime default
  classic:
    ratio: 0.62                  # darker than this fraction of the local paper level = ink
    max_chroma: 70               # ... and neutral (the grid is coloured)
    paper_window_mm: 4.0
    min_speck_px: 6

vectorize:
  separator:                     # SD-100: the column-separator bar many recorders print between lead columns
    enabled: true                # its columns are missing data, not an R wave (aVR read 3x too tall on ecgdig)
    min_mm: 4.0                  # one unbroken vertical run this tall in a single column
    max_mm: 15.0
    search_mm: 1.0               # around each column boundary
    pad_mm: 0.3                  # blanked on each side of the bar
  method: hybrid                 # dp_path | legacy_track | hybrid (DP path + D47 edge/apex detail where they agree)
  fuse_tol_pitches: 0.15         # D47 value kept where within this many row pitches of the DP path
  fuse_margin_cols: 10           # path used this many columns around a stretch where D47 left the row
  fuse_max_gap_pitches: 0.5      # D47 kept in a DP gap only if bounded by agreement on both sides and at most this long
  fuse_apex_strokes: 2.0         # where DP and D47 differ by more than this many strokes, the one further from the isoline wins
  fuse_max_short_cols: 8         # a longer disagreement than this = D47 left the row (an apex lasts a few columns)
  band_pitches: 1.3              # search band around a baseline, in row pitches (20 mm/mV traces cross rows)
  baseline_weight: 0.6           # pull to the own baseline vs continuity
  gap_cost: 2.5                  # per missing column (in stroke widths of vertical jump)
  neighbour_cost: 4.0            # per column riding a flat run on another row's baseline (> gap_cost)
  steep_rows: true               # steep flanks re-read from the rows / the blob's outer edge (SD-058)
  steep_min_slope_strokes: 0.5   # a column is steep when the path moves more than this many strokes per column (SD-061: 1.0 -> 0.5)
  steep_max_run_strokes: 4.0     # row runs longer than this are not the flank (flat stroke, page edge)
  steep_tip_cols: 3              # the path turning back within this many columns = a tip on that side
  gap_flag: 0.05                 # missing share above this -> TRACE_GAPS
  overlap_flag: 0.1              # band-edge contact above this -> LEAD_OVERLAP

validate:
  rhythm_warn: 0.5                # SD-060: rhythm strip vs panel II / (aVF - aVR)/1.5 residual above -> RHYTHM_INCONSISTENT
  rhythm_unrelated: 0.9           # SD-060: every check at least this (~1 = unrelated) -> strip flagged, not measured
  min_median_coverage: 0.5       # below -> rejected TRACE_BROKEN
  min_page_extent: 0.8           # SD-067: ...unless the ink spans less than this of the layout width -> PAGE_INCOMPLETE (a piece of a page)
  lead_min_coverage: 0.8         # any lead with less coverage -> LEAD_INCOMPLETE (needs confirmation)
  limb_warn: 0.7                 # PROVISIONAL: limb-lead consistency below -> LIMB_LEADS_INCONSISTENT (clean pages 0.83-0.86, I<->II swap 0.61)
  beat_check: true               # CardioLens beats vs page columns (D130) disagree -> BEATS_INCONSISTENT (needs confirmation)
  qrs_hump_scale: 0.667          # QRS also measured with the R' hump threshold x this (SD-057); null = off
  qrs_unstable_ms: 20            # ... and a width that moves more than this -> QRS_UNSTABLE (needs confirmation)
  ok_min_overall: 0.6            # overall quality below -> needs_confirmation

artifacts:
  mask_bands: true               # D136: blank the header / footer bands (name, ID, date) in every saved or sent image

board:                           # capture board with ArUco markers (SD-065); no board in the photo -> the grid path
  enabled: true
  specs: [a3, a4, a4w, a3x2]     # configs/scanner/boards/<name>.yaml (a4w: D176, strips up to 152 mm; a3x2: A3 on two A4 sheets, SD-076)
  min_markers: 3                 # fewer: the board is not trusted (one marker's 4 corners fit a plane badly)
  max_residual_mm: 1.0           # marker corners off the fitted homography by more than this: not used
  grid_mismatch: 0.03            # paper grid vs board scale apart by more: the page is not flat / not 1:1 -> grid path
  # SD-075: the paper is the ECG's scale, the board only the plane. Within grid_mismatch the zone is
  # rescaled per axis to the paper grid (a printer's feed error ~1 % stays out of the timing).
  # SD-077: one photo is read up to the markers' inner edges, not only inside the zone: paper laid over
  # the rulers is read whole (an A4 board holds ~248 x 161 mm). The board's print there (rulers, zone
  # outline, title: grey, untinted) is cleared except where tinted / colour-grid paper lies over it.
  read_beyond_zone: true
  read_margin_mm: 1.5            # kept off the markers' inner edges
  print_inset_mm: 2.0            # the band cleared of board print starts this far inside the zone edge (the outline)
  paper_close_mm: 3.0            # paper = tint or colour grid closed over the grid's white cells ...
  paper_min_mm2: 400             # ... in pieces at least this big
  grid_rescale_min: 0.001        # grid and board this close: left as is (the grid reads to ~0.02 %)
  corner_fit_max_spread: 0.005   # board fitted to its 4 corners (middle markers off): grid pitch over the page tiles must agree this well
  detect_max_side_px: 2000       # markers are searched on a copy no larger than this (speed); corners refined at full size
  # SD-069: the zone is cropped to the page (+ pad) before reading; the A3 zone is 340 x 217 mm, a page half of it.
  crop_pad_mm: 8.0               # null: no crop
  crop_edge_mm: 3.0              # band along the zone edge ignored (printed outline)
  crop_chroma_min: 14            # page pixel: max-min channel above this (grid, tinted paper) ...
  crop_gray_max: 200             # ... or darker than this (traces, grey grid)
  crop_line_fraction: 0.02       # a row / column is page when this share of it is page pixels
  crop_min_gain: 0.85            # the box covers more than this share of the zone: not cropped
