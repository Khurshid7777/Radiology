# Telegram client of the ECG scanner (TZ §6.5, SD-009). Secrets from the environment only:
#   ECGSCAN_BOT_TOKEN    — the bot token from @BotFather
#   ECGSCAN_BOT_API_KEY  — the bot's key for the /scans API (one of ECGSCAN_API_KEYS)
#   ECGSCAN_BOT_ALLOWED  — comma-separated Telegram user ids allowed to use the bot
#   ECGSCAN_BOT_API_URL  — overrides api_url (in Docker: http://cardiolens:8000)
#   ECGSCAN_BOT_MODE     — overrides mode
#   ECGSCAN_BOT_GROUPS   — optional: chat ids of groups to read (an administrator can also switch a group on by a button)
#   ECGSCAN_BOT_GROUP_RECIPIENTS — optional: which administrators get the groups' results (default: all of ECGSCAN_BOT_ALLOWED)

api_url: http://127.0.0.1:8000     # the CardioVision API (/api/analyze) or the /scans service
mode: analyze                      # analyze: conclusion + PDF via /api/analyze (D161); scan: the scanner's verdict via /scans
max_mb: 20                         # Telegram Bot API download limit
poll_interval_s: 1.0
poll_timeout_s: 90                 # then the user gets a link instead of the verdict
send_overlay: false                # send the trace overlay preview back (it shows the page header unless masked)

group:                             # SD-107: ECG photos posted in a group -> the result to administrators in private
  notify_refusals: true            # a photo the analysis refused is reported too (one short message); false: only logged
  max_per_hour: 60                 # analyses per group an hour; more are skipped (logged)

report:                            # SD-109: the real-use summary (counts only) to administrators in private; /report on demand
  weekly: true
  weekday: 0                       # 0 = Monday
  hour: 9
  tz: Asia/Tashkent
  days: 7                          # the period a report covers
