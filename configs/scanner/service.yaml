# ECG scanner service (TZ §4, §9; SD-004, SD-005, SD-008). Secrets come from the
# environment only: ECGSCAN_API_KEYS ("name:key,name2:key2") and ECGSCAN_STORAGE_KEY
# (a Fernet key; without it originals are not kept at all — never in plaintext).

storage:
  dir: data/scanner_service        # SQLite job store, encrypted originals, artifacts (env ECGSCAN_SERVICE_DIR overrides)
  keep_originals: true             # needs ECGSCAN_STORAGE_KEY; lets a doctor's calibration correction re-run the scan
  retention_days: 30               # originals and artifact images are deleted after this; results (signals) stay
  purge_interval_h: 1              # D136: retention runs on this timer, not only at start

upload:
  max_mb: 25                        # per photo
  max_parts: 4                     # SD-066: one page photographed in parts on a capture board
  mime: [image/jpeg, image/png, image/tiff]

queue:
  workers: 2                       # scans in parallel (OpenCV releases the GIL)
  max_pending: 20                  # D136: queued + processing scans; more -> 429 (each holds up to 25 MB)
  warm_up: true                    # scan one synthetic page at start: the first photo does not wait ~5 s for model loading

feedback:
  path: data/feedback/scanner_confirmations.jsonl   # doctor confirmations / corrections for future training (TZ §12)

miniapp:                           # SD-137: capture on the Telegram Mini App page (the original goes straight here)
  max_waiting: 20                  # photos held in memory until the bot takes them (each up to upload.max_mb); more -> 429
  max_ticket_minutes: 10           # a ticket valid for longer than this from now is refused, whoever signed it
  max_uploads_per_ticket: 14       # uploads on one button: 10 photos and 4 retakes; after that the ticket is refused (a new /scan gives a new one)
  max_inflight: 4                  # SD-147 review: uploads being read at once on the whole service; more -> 429 before reading
  max_inflight_per_ticket: 2       # ... and on one button (slow uploads of one button cannot hold everyone's)
  body_timeout_s: 60               # a photo's body must arrive within this; then 408 and its room is freed
  flying_max_s: 900                # SD-155: a reservation not given back by its upload goes after this (a bug guard only)
  max_files: 10                    # SD-147: photos of one record on one button (a long strip in parts), as a Telegram album
  max_total_mb: 60                 # SD-147: all photos of one record together (the analysis takes 64 MB)
  max_store_mb: 300                # SD-147: all records waiting in memory together; more -> 429
  check_width: 1280                # the frame check runs on a copy this wide (as the site's camera preview)
  small_side_px: 2000              # no grid found and the long side below this: say the photo is small
  turn_jpeg_quality: 95            # SD-138: the doctor's quarter turn is made on a copy saved as JPEG at this quality (as the site's, D194)

public_url: null                   # base URL for result links in the bot, e.g. https://clinic.example/

confirm:
  max_comment_chars: 500           # D136: free text is kept only until retention; no names or IDs

access:
  admins: []                       # D136: API key names that may open scans of other keys (a key sees only its own)

extensions:                        # P2 (TZ 18.11, SD-097): seams only; each needs its implementation registered
  consult: false                   # share a scan with a colleague, comments on a lead, notifications
  archive: false                   # a patient's scans by subject_ref; serial comparison through the core
  qr: false                        # patient codes cv1:s/<subject_ref>, web sign-in cv1:l/<token>
  signature: false                 # the doctor's signature over ScanResult.content_sha256()
