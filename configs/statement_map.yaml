# Finding codes -> reference label systems (D102; plan docs/PLAN_V2.md step 3).
#
# One table for every external check: a finding is scored against a dataset label only
# through this map, so "AF" means the same thing on PTB-XL (SCP) and on the PhysioNet
# Challenge 2021 sets (SNOMED CT) and the scorer needs no per-dataset code lists.
#
#   aha:    statement group of the AHA/ACCF/HRS diagnostic statement list (Mason et al.
#           2007, part II) -- the category, not its numeric code
#   snomed: SNOMED CT concept ids as used by PhysioNet Challenge 2020/2021 labels
#   scp:    PTB-XL SCP-ECG statements
# Empty lists mean "no reference label to score against", not "never present".
#
# Statements the AHA list has and CardioLens does not emit yet (gaps, plan step 3):
# second-degree AV block (Mobitz I/II, 2:1), left anterior / posterior fascicular block,
# incomplete bundle branch blocks, premature atrial complexes, junctional rhythm,
# old/acute infarction by territory.

atrial_fibrillation:        {aha: rhythm, snomed: ["164889003"], scp: [AFIB]}
atrial_flutter:             {aha: rhythm, snomed: ["164890007"], scp: [AFLT]}
sinus_rhythm:               {aha: rhythm, snomed: ["426783006"], scp: [SR]}
sinus_bradycardia:          {aha: rhythm, snomed: ["426177001"], scp: [SBRAD]}
sinus_tachycardia:          {aha: rhythm, snomed: ["427084000"], scp: [STACH]}
supraventricular_tachycardia: {aha: rhythm, snomed: ["426761007", "67198005", "713422000"], scp: [SVTAC, PSVT]}
